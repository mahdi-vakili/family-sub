services:
  app:
    build: .
    container_name: family-sub
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DATABASE_PATH: /app/data/app.db
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/admin/login').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
